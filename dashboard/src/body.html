<div class="app">
  <nav class="side" aria-label="Sections">
    <div class="brandwrap">
      <button class="brand" id="brandBtn" aria-expanded="false" aria-controls="brandPop" title="Change the logo and name"><img id="wsLogo" alt="" width="44" height="44" hidden><span class="mark" id="wsMark"></span><span class="bt"><b id="ws">Workspace</b><span>Command Center</span></span></button>
      <div class="brandpop" id="brandPop" hidden>
        <label class="btn" for="logoFile">Upload your logo</label><input id="logoFile" type="file" accept="image/*" hidden>
        <label class="lbl" for="wsName">Business name</label><input class="search" id="wsName" type="text" autocomplete="off">
        <button class="btn" id="brandReset">Use the default</button>
        <p id="brandMsg">Square images look best. In this preview the change stays in this browser.</p>
      </div>
    </div>
    <div class="navgroup"><div class="eyebrow">Run the floor</div>
      <button class="nav" data-go="overview">%grid%Overview<span class="badge crit" id="nbOverview"></span></button>
      <button class="nav" data-go="floor">%pulse%Live floor<span class="badge" id="nbFloor"></span></button>
      <button class="nav" data-go="calls">%phone%Calls</button></div>
    <div class="navgroup"><div class="eyebrow">People</div>
      <button class="nav" data-go="agents">%users%Agents</button>
      <button class="nav" data-go="publishers">%radio%Publishers</button>
      <button class="nav" data-go="pipeline">%cal%Pipeline<span class="badge" id="nbPipeline"></span></button></div>
    <div class="navgroup"><div class="eyebrow">Money</div>
      <button class="nav" data-go="money">%wallet%Money</button></div>
    <div class="navgroup"><div class="eyebrow">Marketing</div>
      <button class="nav" data-go="growth">%trend%Growth</button>
      <button class="nav" data-go="ads">%horn%Facebook Ads</button>
      <button class="nav" data-go="dms">%msg%Ad DMs</button>
      <button class="nav" data-go="inbox">%inbox%Inbox</button></div>
    <div class="navgroup"><div class="eyebrow">Your business</div>
      <button class="nav" data-go="connect">%plug%Connect</button>
      <button class="nav" data-go="grow">%spark%Make more money</button>
      <button class="nav" data-go="opensource">%code%Open source</button>
      <button class="nav" data-fb>%msg%Send feedback</button>
      <button class="nav" data-tour>%play%Replay the welcome</button></div>
    <div class="sidefoot" id="sideNote"><b>Design preview.</b> Real numbers, frozen at one moment. Your live dashboard is unchanged.</div>
    <div class="credit">Free · by <b>Hot Inbound Calls</b></div>
  </nav>
  <main class="main" id="main">
    <header class="top">
      <img class="toplogo" id="wsLogoTop" alt="" width="32" height="32" hidden><div><h1 id="vTitle">Overview</h1><div class="sub" id="vSub"></div></div><span class="sp"></span>
      <div class="seg" id="period" role="group" aria-label="Show numbers for"><button data-pk="today">Today</button><button data-pk="d7">Last 7 days</button><button data-pk="d30">Last 30 days</button></div>
      <span class="chip" id="balChip"></span><span class="chip demo" id="asOf"></span>
    </header>
    <div class="wrap" id="view"></div>
  </main>
</div>
<div class="tip" id="tip" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" hidden>
  <header class="sh-h"><button class="btn" id="shBack" hidden>‹ Back</button><div class="sh-t"><div class="eyebrow" id="shEb"></div><h2 id="shTitle"></h2><div class="sh-big num" id="shBig"></div></div><button class="btn" id="shClose" aria-label="Close">✕</button></header>
  <div class="sh-b" id="shBody"></div>
  <footer class="sh-f" id="shSrc"></footer>
</aside>
